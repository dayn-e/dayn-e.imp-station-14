- type: entity
  name: Hyperdermic Needle
  parent: [BaseItem, BaseMedicalContraband]
  id: HyperdermicNeedle
  description: This monstrosity is the epitome of medical malpractice. The injection mechanism seems to only go off when enough force is applied. Maybe you should grab some gauze...
  components:
  - type: Sharp
  - type: EmbeddableProjectile
  - type: ThrowingAngle
    angle: 315
  - type: LandAtCursor
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 5
    attackRate: 0.6
    animation: WeaponArcThrust
    angle: 0
    wideAnimationRotation: -135
    soundHit:
      path: /Audio/Weapons/pierce.ogg
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 7
        Structural: 20
  - type: Item
    size: Ginormous
    sprite: Objects/Weapons/Melee/fireaxe.rsi # TODO replace placeholder
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 120
  - type: MeleeChemicalInjector
    transferAmount: 15 # How many units on melee hit
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: SolutionInjectOnEmbed
    transferAmount: 30 # How many units on a sucessful throw & embed
    solution: melee
    blockSlots: OUTERCLOTHING
  - type: SolutionTransfer
    maxTransferAmount: 5
  - type: DamageOtherOnHit
    meleeDamageMultiplier: 1.5
    staminaCost: 40
  - type: Clothing
    sprite: Objects/Weapons/Melee/fireaxe.rsi # TODO replace placeholder
    quickEquip: false
    slots:
    - back
  - type: Sprite
    sprite: Objects/Weapons/Melee/fireaxe.rsi # TODO replace placeholder
    state: icon
  - type: ExaminableSolution # TODO: Figure out how to display the unit count, if possible. Injector type perhaps? but then slow down the inject by a ton
    solution: melee
    exactVolume: true
  - type: Spillable
    solution: melee
  - type: SolutionContainerVisuals
    maxFillLevels: 0 # TODO Change on sprite change?
    solutionName: melee
  - type: SolutionItemStatus
    solution: melee
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
# TODO: Add spillable, figure out how to showcase the contents on the icon. check beaker yml logic?
